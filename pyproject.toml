[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am-insitu-quality-control"
version = "0.1.0"
description = "Multimodal in-situ defect detection for laser powder bed fusion using OT and MPM/PBI images."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mohammadamin Nouri Uoshanloei"}]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.7.0",
  "opencv-python>=4.8.0",
  "PyYAML>=6.0",
  "tqdm>=4.65.0",
  "streamlit>=1.32.0"
]

[tool.setuptools.packages.find]
where = ["src"]
